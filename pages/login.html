
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login CAIS</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="brand-block">
            <p class="eyebrow">CAIS</p>
            <h1>Login Akademik</h1>
        </div>

        <form class="login-form">
            <label for="username">Username</label>
            <input id="username" type="text" placeholder="Masukkan username" required>

            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Masukkan password" required>

            <button type="submit" class="primary-btn">Login</button>
        </form>
    </div>
</body>
</html>
